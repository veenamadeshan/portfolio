<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .tile { fill: #7A5C2E; }
    .mark { fill: #FAF8F5; font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 42px; letter-spacing: 2px; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #C9A96A; }
      .mark { fill: #1B140A; }
    }
  </style>
  <rect class="tile" width="100" height="100" rx="24"/>
  <text class="mark" x="51" y="50" text-anchor="middle" dominant-baseline="central">VM</text>
</svg>
